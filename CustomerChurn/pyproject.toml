[project]
name = "customer-churn-api"
version = "0.1.0"
description = "Customer churn prediction API"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "scikit-learn",
    "joblib",
    "pydantic",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]